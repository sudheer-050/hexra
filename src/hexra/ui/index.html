<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="hexra-token" content="__TOKEN__">
<title>Hexra</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo"><img src="/logo.png" alt=""></span><span class="brand-name">HEXRA</span></div>
    <nav id="nav" aria-label="Sections"></nav>
    <button id="fx" class="fxbtn" type="button" aria-pressed="true" title="Animated effects on / off">✦</button>
    <button id="save" class="btn accent" disabled>Save changes</button>
  </header>
  <div class="wrap">
    <section class="stage" aria-label="Camera and controls">
      <div id="cam-slot-side"><div class="cam" id="cam-card">
        <div class="cam-view">
          <img id="cam" alt="Live camera view with the detected hand" hidden>
          <div id="cam-off" class="cam-off"><div class="rings" aria-hidden="true"><i></i><i></i><i></i></div><span>Camera is off</span></div>
          <i class="br tl" aria-hidden="true"></i><i class="br tr" aria-hidden="true"></i><i class="br bl" aria-hidden="true"></i><i class="br brr" aria-hidden="true"></i>
          <div class="sweep" aria-hidden="true"></div>
          <div class="hud" id="cam-status" hidden><span id="cam-chip" class="chip neutral">Off</span><span id="cam-text" class="hud-text"></span></div>
          <p id="cam-note" class="cam-note" hidden></p>
        </div>
        <div class="cam-ctl">
          <button id="cam-start" class="btn accent">Start Hexra</button>
          <button id="cam-toggle" class="btn" hidden>Pause</button>
          <label class="switch-row cam-try"><input type="checkbox" id="cam-dry"> Try it: show poses, never move the mouse</label>
          <span class="cam-hint"><span class="dot"></span> On your device · closing this window keeps Hexra in the tray</span>
        </div>
      </div></div>
    </section>
    <main class="insp" id="main" tabindex="-1"></main>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
<script src="/fx.js"></script>
</body>
</html>
