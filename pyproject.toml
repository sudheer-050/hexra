[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexra"
version = "1.7.0"
description = "Control your screen with hand poses: MediaPipe landmarks, a classifier trained on your own hand, one-euro smoothing."
requires-python = ">=3.10"
dependencies = ["mediapipe>=0.10", "opencv-python>=4.8", "numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3", "pynput>=1.7.6", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
